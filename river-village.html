</style></head><body><header><h1>河畔村落 · 分层渲染实验</h1><p>实际 Banish Canvas 渲染与原素材；固定布景，未接入正式游戏。拖动平移，不写存档。</p><nav><button id="baseline" aria-pressed="true">原版对照</button><button id="combined" aria-pressed="false">组合效果</button><button id="reset">重置镜头</button><label>缩放 <select id="zoom"><option>1</option><option selected>1.6</option><option>2</option></select></label></nav><nav id="effects"><label><input type="checkbox" name="ground">土路与地表交界</label><label><input type="checkbox" name="shadows">投影</label><label><input type="checkbox" name="contact">接触暗部</label><label><input type="checkbox" name="shore">浅水与岸石</label><label><input type="checkbox" name="foliage">混合树冠</label></nav><p>投影为透明轮廓近似；树冠复用果园树素材。不是 A 原画复刻，也不代表实体手机性能。</p></header><canvas id="scene" aria-label="可拖动的河畔村落渲染对照"></canvas><footer><span id="status">加载素材…</span><span id="error" role="alert"></span></footer>
